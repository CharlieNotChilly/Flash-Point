x-app: &app
  image: flashpoint-app:local
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flashpoint
      POSTGRES_PASSWORD: flashpoint
      POSTGRES_DB: flashpoint_development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flashpoint -d flashpoint_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    build: .
    pull_policy: build
    command: ["sh", "-ec", "bin/rails db:prepare && exec bundle exec puma -C config/puma.rb"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess))"]
      interval: 5s
      timeout: 4s
      retries: 20

  sidekiq:
    <<: *app
    pull_policy: never
    command: ["bundle", "exec", "sidekiq", "-c", "5"]
    depends_on:
      web:
        condition: service_healthy

  sweeper:
    <<: *app
    pull_policy: never
    command: ["bin/sweeper"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
